<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng ký Người dùng</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #11998e;
            margin-bottom: 8px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #11998e;
            box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.15);
        }
        .gender-group {
            display: flex;
            gap: 25px;
            margin-top: 8px;
        }
        .gender-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gender-item input {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }
        .gender-item label {
            margin-bottom: 0;
            font-weight: 400;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button[type="submit"] {
            background: #11998e;
            color: white;
        }
        button[type="submit"]:hover {
            background: #0e8075;
        }
        button[type="reset"] {
            background: #f1f1f1;
            color: #333;
        }
        button[type="reset"]:hover {
            background: #e0e0e0;
        }
        .required::after {
            content: " *";
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Đăng ký Người dùng</h2>
        <p class="subtitle">Vui lòng điền đầy đủ thông tin bên dưới</p>

        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <!-- Họ và tên -->
            <div class="form-group">
                <label for="name" class="required">Họ và tên</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="required">Email</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label for="phone" class="required">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" placeholder="0912345678" required>
            </div>

            <!-- Giới tính -->
            <div class="form-group">
                <label class="required">Giới tính</label>
                <div class="gender-group">
                    <div class="gender-item">
                        <input type="radio" id="gender-male" name="gender" value="male" required>
                        <label for="gender-male">Nam</label>
                    </div>
                    <div class="gender-item">
                        <input type="radio" id="gender-female" name="gender" value="female">
                        <label for="gender-female">Nữ</label>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit">Đăng ký</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>
</body>
</html>
